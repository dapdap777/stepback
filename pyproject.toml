[project]
# Package, import and CLI command all share one name: `stepline`.
name = "stepline"
version = "0.1.0"
description = "Time-travel debugger for AI agents: record every LLM call, inspect it in a local web UI, and replay from any step."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Stepline contributors" }]
keywords = ["llm", "agents", "debugger", "anthropic", "claude", "observability", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Supported range. The floor and the newest release are both tested in CI
# (.github/workflows/ci.yml); keep the two in sync with SUPPORTED_ANTHROPIC in
# src/stepline/recorder/anthropic_adapter.py.
anthropic = ["anthropic>=0.40,<3"]

[project.scripts]
stepline = "stepline.cli:main"

[project.urls]
Homepage = "https://github.com/dapdap777/stepline"
Issues = "https://github.com/dapdap777/stepline/issues"
Changelog = "https://github.com/dapdap777/stepline/blob/main/CHANGELOG.md"
Security = "https://github.com/dapdap777/stepline/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "anthropic>=0.40,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stepline"]
# The built frontend is gitignored but must ship in the wheel.
artifacts = ["src/stepline/server/static/**"]

[tool.hatch.build.targets.wheel.force-include]
# `stepline demo` runs the example agent; ship it inside the package.
"examples/weather_agent.py" = "stepline/demo/weather_agent.py"

[tool.hatch.build.targets.sdist]
include = ["src/stepline", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]
artifacts = ["src/stepline/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/stepline"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true
